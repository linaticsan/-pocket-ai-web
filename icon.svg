<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Pocket AI mascot logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8ff"/>
      <stop offset="1" stop-color="#eee5fb"/>
    </linearGradient>
    <radialGradient id="body" cx="35%" cy="22%" r="82%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".52" stop-color="#fcf9ff"/>
      <stop offset=".82" stop-color="#f4ecff"/>
      <stop offset="1" stop-color="#e8dcf7"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#251336"/>
      <stop offset=".42" stop-color="#4e2876"/>
      <stop offset=".75" stop-color="#7d54b9"/>
      <stop offset="1" stop-color="#c4a6ee"/>
    </linearGradient>
    <radialGradient id="blush">
      <stop offset="0" stop-color="#f3a9cb" stop-opacity=".58"/>
      <stop offset="1" stop-color="#e2c5f2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#5d427a" flood-opacity=".16"/>
    </filter>
    <clipPath id="round">
      <rect width="256" height="256" rx="58"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <circle cx="46" cy="47" r="21" fill="#fff" opacity=".34"/>
    <circle cx="214" cy="54" r="28" fill="#fff" opacity=".24"/>

    <g filter="url(#shadow)">
      <ellipse cx="128" cy="208" rx="65" ry="13" fill="#594071" opacity=".11"/>
      <path d="M128 48
               C79 48 49 83 48 133
               C47 181 76 210 128 210
               C180 210 209 181 208 133
               C207 83 177 48 128 48Z"
            fill="url(#body)"/>
    </g>

    <ellipse cx="96" cy="92" rx="31" ry="19" fill="#fff" opacity=".72"/>
    <ellipse cx="111" cy="84" rx="12" ry="8" fill="#fff" opacity=".92"/>

    <g>
      <ellipse cx="92" cy="128" rx="25" ry="31" fill="url(#eye)" stroke="#45255f" stroke-opacity=".55" stroke-width="2"/>
      <ellipse cx="164" cy="128" rx="25" ry="31" fill="url(#eye)" stroke="#45255f" stroke-opacity=".55" stroke-width="2"/>
      <ellipse cx="84" cy="117" rx="7" ry="9" fill="#fff"/>
      <ellipse cx="156" cy="117" rx="7" ry="9" fill="#fff"/>
      <circle cx="99" cy="142" r="4" fill="#fff" opacity=".82"/>
      <circle cx="171" cy="142" r="4" fill="#fff" opacity=".82"/>
    </g>

    <ellipse cx="72" cy="158" rx="23" ry="11" fill="url(#blush)"/>
    <ellipse cx="184" cy="158" rx="23" ry="11" fill="url(#blush)"/>

    <g fill="none" stroke="#735a88" stroke-width="4" stroke-linecap="round">
      <path d="M118 160 Q123 168 128 160"/>
      <path d="M128 160 Q133 168 138 160"/>
    </g>

    <path d="M71 186 C92 201 164 201 185 186 C172 207 84 207 71 186Z" fill="#fff" opacity=".28"/>
  </g>
</svg>