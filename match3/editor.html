<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luma Grove Level Editor</title><link rel="stylesheet" href="./styles.css"><style>.editor-shell{display:grid;grid-template-columns:180px minmax(320px,1fr) 280px;gap:14px}.palette,.props{display:grid;gap:7px;align-content:start}.palette button.active{outline:2px solid #fff}.editor-board{--cols:8;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px;background:#080c1c;padding:8px;border-radius:18px}.editor-cell{aspect-ratio:1;border:1px solid #ffffff18;background:#ffffff0d;color:#fff;border-radius:9px;display:grid;place-items:center;cursor:crosshair;min-width:0}.editor-cell small{font-size:8px}.editor-cell.disabled{opacity:.25}.editor-cell.has-blocker{box-shadow:inset 0 0 0 3px #bfeeff}.editor-cell.locked{outline:2px dashed #ffd86b}.props label{display:grid;gap:4px;font-size:.8rem}.props input,.props select,.props textarea{width:100%;background:#080b15;color:#fff;border:1px solid #ffffff22;border-radius:10px;padding:8px}.props textarea{height:180px;font:10px ui-monospace,monospace}.editor-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.validation{white-space:pre-wrap;color:#bfffd7;font:11px ui-monospace,monospace}.sim{white-space:pre-wrap;font:10px ui-monospace,monospace;background:#060914;padding:8px;border-radius:10px}@media(max-width:900px){.editor-shell{grid-template-columns:1fr}.palette{grid-template-columns:repeat(4,1fr)}.props{grid-template-columns:repeat(2,1fr)}.props .full{grid-column:1/-1}}</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">Internal content tool</div><h1>Luma Grove Level Editor</h1></div><div class="actions"><a href="./index.html">Play Game</a></div></header><div class="editor-shell"><aside class="panel palette"><strong>Tools</strong><button data-tool="erase" class="active">Erase</button><button data-tool="disabled">Enable / Disable</button><button data-tool="ice">Ice</button><button data-tool="crate">Crate ×2</button><button data-tool="locked">Lock</button><button data-tool="piece:red">Red piece</button><button data-tool="piece:blue">Blue piece</button><button data-tool="piece:green">Green piece</button><button data-tool="piece:yellow">Yellow piece</button><button data-tool="piece:purple">Purple piece</button><button data-tool="piece:orange">Orange piece</button></aside><section class="panel"><div class="editor-board" data-editor-board></div><div class="editor-actions"><button class="tool-btn" data-undo>Undo</button><button class="tool-btn" data-redo>Redo</button><button class="tool-btn" data-clear>Clear Board</button><button class="tool-btn" data-validate>Validate</button><button class="tool-btn" data-playtest>Play Test</button><button class="tool-btn" data-simulate>Simulate ×100</button></div><pre class="sim" data-sim-result>Simulation results appear here.</pre></section><aside class="panel props"><strong>Level properties</strong><label>Name<input data-prop name="name"></label><label>Width<input data-prop name="width" type="number" min="3" max="20"></label><label>Height<input data-prop name="height" type="number" min="3" max="20"></label><label>Moves<input data-prop name="moves" type="number" min="1"></label><label>Colors<select data-prop name="colors"><option>3</option><option>4</option><option selected>5</option><option>6</option></select></label><label>Gravity<select data-prop name="gravity"><option>down</option><option>up</option><option>left</option><option>right</option></select></label><div class="full validation" data-validation></div><label class="full">JSON<textarea data-json readonly></textarea></label><button class="tool-btn full" data-copy>Copy JSON</button></aside></div></main><script type="module" src="./src/editor.js"></script></body></html>
