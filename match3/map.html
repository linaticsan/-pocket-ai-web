<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luma Grove Map</title><link rel="stylesheet" href="./styles.css"><style>.map-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.map-tools input{width:110px;background:#090d19;color:#fff;border:1px solid #ffffff24;border-radius:10px;padding:8px}.level-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin-top:16px}.level-node{min-height:100px;border-radius:18px;padding:12px;background:#ffffff0b;border:1px solid #ffffff16;color:inherit;text-decoration:none;display:grid;align-content:center;text-align:center}.level-node strong{font-size:1.35rem}.level-node span{color:#ffe27a}.level-node small{font-size:.68rem;color:#9aa6cb}.level-node.current{outline:3px solid #7fffd1;background:#7fffd112}.level-node.completed{background:#ffffff12}.level-node.locked{opacity:.4}</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">Virtualized progression</div><h1>Luma Grove World Map</h1><div class="state" data-map-status></div></div><div class="actions"><a href="./index.html">Play</a><a href="./editor.html">Editor</a></div></header><section class="panel"><div class="map-tools"><label>Jump near level <input data-jump type="number" min="1" max="10000" value="1"></label><span class="state">Only a ±30 level window is rendered.</span></div><div class="level-map" data-map></div></section></main><script type="module" src="./src/map.js"></script></body></html>
